<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magia Floral 3D - Estilo Pixar</title>
    <style>
        :root {
            --navy-blue: #0a192f;
            --light-blue: #112240;
            --glow-color: rgba(255, 215, 0, 0.3);
            --table-top: #4a3018;
            --table-front: #2a1608;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: radial-gradient(circle at 50% 40%, var(--light-blue) 0%, var(--navy-blue) 80%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Superficie de la mesa */
        .table {
            position: absolute;
            bottom: 0;
            width: 100vw;
            height: 25vh;
            background: linear-gradient(to bottom, var(--table-top), var(--table-front));
            box-shadow: 0 -15px 40px rgba(0,0,0,0.7);
            border-top: 5px solid rgba(255,255,255,0.05);
            z-index: 1;
        }

        .scene {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        /* Iluminación cálida de fondo */
        .backlight {
            position: absolute;
            width: 50vw;
            height: 50vw;
            max-width: 500px;
            max-height: 500px;
            background: radial-gradient(circle, var(--glow-color) 0%, transparent 60%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulseLight 4s ease-in-out infinite alternate;
            z-index: 0;
        }

        @keyframes pulseLight {
            0% { opacity: 0.7; transform: translate(-50%, -50%) scale(0.9); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        }

        /* Jarrón de cristal (Glassmorphism) */
        .vase-container {
            position: absolute;
            bottom: 20vh;
            transform: translateY(40px);
            z-index: 10;
        }

        .vase {
            width: 180px;
            height: 240px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 40% 40% 35% 35% / 60% 60% 30% 30%;
            border: 2px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 
                inset 15px 0 30px rgba(255,255,255,0.2),
                inset -15px 0 30px rgba(0,0,0,0.3),
                0 25px 45px rgba(0,0,0,0.6),
                0 0 50px rgba(255, 215, 0, 0.15);
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .water {
            width: 100%;
            height: 45%;
            background: linear-gradient(to bottom, rgba(135, 206, 235, 0.2), rgba(65, 105, 225, 0.4));
            border-radius: 0 0 35% 35% / 0 0 30% 30%;
            border-top: 2px solid rgba(255,255,255,0.3);
            position: absolute;
            bottom: 0;
        }

        .stems {
            display: flex;
            gap: 8px;
            height: 140px;
            position: relative;
            z-index: 1;
            padding-bottom: 10px;
        }

        .stem {
            width: 6px;
            height: 100%;
            background: linear-gradient(to top, #1b5e20, #4caf50);
            border-radius: 3px;
            opacity: 0.85;
        }

        /* Ramo de flores exuberante */
        .bouquet {
            position: absolute;
            bottom: calc(20vh + 180px);
            width: 450px;
            height: 400px;
            z-index: 15;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .flower {
            position: absolute;
            filter: drop-shadow(0 12px 15px rgba(0,0,0,0.5));
            animation: floatingFlower 6s ease-in-out infinite;
            transition: transform 0.3s;
        }

        .flower:hover {
            transform: scale(1.2) rotate(10deg) !important;
            cursor: pointer;
            z-index: 50 !important;
        }

        @keyframes floatingFlower {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(4deg); }
        }

        /* Posicionamiento y tamaños de las flores */
        .f1 { font-size: 6.5rem; z-index: 25; top: 10%; left: 35%; animation-delay: 0s; }
        .f2 { font-size: 5.5rem; z-index: 20; top: 25%; left: 15%; animation-delay: 0.3s; }
        .f3 { font-size: 5.5rem; z-index: 21; top: 20%; left: 60%; animation-delay: 0.6s; }
        .f4 { font-size: 4.5rem; z-index: 18; top: 50%; left: 5%; animation-delay: 0.9s; }
        .f5 { font-size: 4.5rem; z-index: 17; top: 45%; left: 75%; animation-delay: 1.2s; }
        .f6 { font-size: 4rem; z-index: 16; top: 0%; left: 45%; animation-delay: 1.5s; }
        .f7 { font-size: 3.5rem; z-index: 24; top: 65%; left: 25%; animation-delay: 0.2s; }
        .f8 { font-size: 3.5rem; z-index: 23; top: 70%; left: 55%; animation-delay: 0.5s; }
        .f9 { font-size: 4rem; z-index: 26; top: 45%; left: 40%; animation-delay: 0.8s; }
        .f10 { font-size: 3.5rem; z-index: 22; top: 55%; left: 20%; animation-delay: 1.1s; }
        .f11 { font-size: 3.5rem; z-index: 22; top: 60%; left: 65%; animation-delay: 1.4s; }

        /* Animalitos */
        .characters {
            position: absolute;
            bottom: calc(20vh - 20px);
            width: 380px;
            display: flex;
            justify-content: space-between;
            z-index: 30;
        }

        .animal {
            font-size: 5.5rem;
            filter: drop-shadow(0 15px 12px rgba(0,0,0,0.6));
            animation: bounceAnimal 3.5s infinite ease-in-out;
        }

        .cat { animation-delay: 0s; }
        .raccoon { transform: scaleX(-1); animation-delay: 0.5s; }

        @keyframes bounceAnimal {
            0%, 100% { transform: translateY(0) scaleX(var(--facing, 1)); }
            50% { transform: translateY(-15px) scaleX(var(--facing, 1)); }
        }

        /* Partículas Mágicas */
        .sparkle {
            position: absolute;
            border-radius: 50%;
            background-color: #fff;
            box-shadow: 0 0 10px #ffea00, 0 0 20px #ffb300;
            pointer-events: none;
            opacity: 0;
            z-index: 40;
            animation: floatUp var(--speed) linear forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0); opacity: 0; }
            20% { opacity: 1; transform: scale(1.2); }
            80% { opacity: 0.8; }
            100% { transform: translateY(-250px) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="table"></div>
    <div class="backlight"></div>

    <div class="scene">
        
        <!-- El Ramo Exuberante -->
        <div class="bouquet">
            <!-- Lirios (Representados con flor de hibisco y filtro de color para hacerlos amarillos/dorados) -->
            <div class="flower f1" style="filter: hue-rotate(90deg) saturate(2) drop-shadow(0 12px 15px rgba(0,0,0,0.5));">🌺</div>
            <div class="flower f2" style="filter: hue-rotate(90deg) saturate(2) drop-shadow(0 12px 15px rgba(0,0,0,0.5));">🌺</div>
            <div class="flower f3" style="filter: hue-rotate(90deg) saturate(2) drop-shadow(0 12px 15px rgba(0,0,0,0.5));">🌺</div>
            
            <!-- Girasoles grandes -->
            <div class="flower f4">🌻</div>
            <div class="flower f5">🌻</div>
            <div class="flower f6">🌻</div>
            
            <!-- Margaritas y Rosas Amarillas -->
            <div class="flower f7">🌼</div>
            <div class="flower f8">🌼</div>
            <div class="flower f9">🏵️</div>
            <div class="flower f10">🏵️</div>
            <div class="flower f11">🌼</div>
        </div>

        <!-- El Jarrón de Cristal -->
        <div class="vase-container">
            <div class="vase">
                <div class="stems">
                    <div class="stem" style="transform: rotate(-12deg);"></div>
                    <div class="stem" style="transform: rotate(-6deg);"></div>
                    <div class="stem" style="transform: rotate(0deg);"></div>
                    <div class="stem" style="transform: rotate(5deg);"></div>
                    <div class="stem" style="transform: rotate(14deg);"></div>
                </div>
                <div class="water"></div>
            </div>
        </div>

        <!-- Los Personajes -->
        <div class="characters">
            <div class="animal cat" style="--facing: 1;">🐈‍⬛</div>
            <div class="animal raccoon" style="--facing: -1;">🦝</div>
        </div>

    </div>

    <!-- Script para generar el efecto mágico de partículas -->
    <script>
        function createSparkle() {
            const sparkle = document.createElement('div');
            sparkle.classList.add('sparkle');
            
            // Posición inicial aleatoria (focalizada alrededor del jarrón)
            const startX = (window.innerWidth / 2) + (Math.random() * 400 - 200);
            const startY = (window.innerHeight / 2) + (Math.random() * 200);
            
            // Tamaño y velocidad
            const size = Math.random() * 5 + 2;
            const speed = Math.random() * 3 + 2;
            
            sparkle.style.left = `${startX}px`;
            sparkle.style.top = `${startY}px`;
            sparkle.style.width = `${size}px`;
            sparkle.style.height = `${size}px`;
            sparkle.style.setProperty('--speed', `${speed}s`);
            
            document.body.appendChild(sparkle);
            
            // Limpiar el DOM
            setTimeout(() => {
                sparkle.remove();
            }, speed * 1000);
        }

        // Generar partículas constantemente
        setInterval(createSparkle, 200);
    </script>
</body>
</html>
